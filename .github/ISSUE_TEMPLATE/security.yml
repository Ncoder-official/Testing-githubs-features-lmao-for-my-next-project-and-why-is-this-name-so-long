name: "Security report"
description: "Report a potential security vulnerability. Please do not include exploit details in a public issue."
title: "[Security] "
labels:
  - security
body:
  - type: markdown
    attributes:
      value: |
        Please avoid posting sensitive vulnerability details publicly.
        Where possible, use the repository's private vulnerability reporting
        feature or the contact method listed in SECURITY.md.

  - type: textarea
    id: summary
    attributes:
      label: Brief summary
      description: "Keep this high-level. Do not include secrets, personal data, or weaponized proof-of-concept material."
    validations:
      required: true

  - type: input
    id: affected
    attributes:
      label: Affected component or version
      placeholder: "Component and version, if known"

  - type: textarea
    id: impact
    attributes:
      label: Potential impact
      description: "Describe the possible impact at a high level."
    validations:
      required: true

  - type: textarea
    id: contact
    attributes:
      label: Safe contact details
      description: "Provide a way to coordinate privately, if appropriate. Do not include credentials."
