name: "Bug report"
description: "Something isn't working as expected."
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. A few details will help us track it down.

  - type: input
    id: version
    attributes:
      label: Acceleratorrr~ version
      placeholder: "Version, build number, or commit"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - Linux
        - macOS
        - Other
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Editor and relevant tools
      description: "For example: VS Code, compiler, runtime, or extensions."
      placeholder: "Add anything relevant"

  - type: dropdown
    id: module
    attributes:
      label: Where does the problem occur?
      options:
        - Editing
        - Completion
        - Refactoring
        - Navigation
        - Debugging
        - Diagnostics
        - Code generation
        - Context management
        - Action engine
        - Execution
        - Language packs
        - User interface
        - Installation / updater
        - Core engine
        - Other / not sure
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: What went wrong?
      description: "A quick description is enough to start."
      placeholder: "Tell us what happened..."
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: "List the steps if you know them."
      placeholder: |
        1. I opened...
        2. I selected...
        3. Then...
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      placeholder: "Describe the expected result."
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs or error messages
      description: "Paste relevant output. Remove tokens, passwords, and personal data first."
      render: text
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: "Screenshots, workarounds, when it started, or other useful context."
    validations:
      required: false
